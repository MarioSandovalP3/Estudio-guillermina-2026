<div id="main">

    <div class="page-heading d-flex justify-content-between align-items-center flex-wrap">

        <!-- TÍTULO -->
        <div>
            <h3 class="fw-bold mb-0">Panel de Control - Estudio de Belleza Guilllermina</h3>
            <p class="text-muted mb-0">Gestión inteligente de reservas, clientes e ingresos</p>
        </div>


        <!-- CARD DÓLAR PEQUEÑO -->
        <div class="card shadow-sm border-0" style="min-width: 180px;">

            <div class="card-body d-flex align-items-center py-2 px-3">

                <div class="stats-icon me-2 bg-warning d-flex align-items-center justify-content-center"
                    style="width: 35px; height: 35px; font-size: 16px;">
                    <i class="bi bi-currency-exchange"></i>
                </div>

                <div>
                    <div style="font-size: 12px; color: #6c757d;">Dólar BCV</div>
                    <div class="fw-bold" style="font-size: 14px;">
                        {{ "%.2f"|format(tasa_bcv or 0) }} Bs
                    </div>
                </div>

            </div>
        </div>

    </div>

    <div class="page-content">
        <section class="row">



            <!-- IZQUIERDA -->
            <div class="col-12 col-lg-9">

                <!-- KPIs -->
                <div class="row">

                    <div class="col-6 col-lg-3">
                        <div class="card card">
                            <div class="card-body d-flex align-items-center">
                                <div class="stats-icon me-3 bg-primary">
                                    <i class="bi bi-calendar-check-fill"></i>
                                </div>
                                <div>
                                    <div class="mini-title">Reservas</div>

                                    <div class="counter" data-target="{{ reservas['total_reservas_activas'] }}">
                                        0
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card card">
                            <div class="card-body d-flex align-items-center">
                                <div class="stats-icon me-3 bg-info">
                                    <i class="bi bi-people-fill"></i>
                                </div>
                                <div>
                                    <div class="mini-title">Clientes</div>

                                    <div class="counter" data-target="{{ clientes['total_clientes_activos'] }}">
                                        0
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>




                </div>

                <!-- RESERVAS -->
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-bar-chart-line"></i> Reservas</h5>
                        <select id="filtroReservas" class="form-select w-auto">
                            <option value="mes">Mensual</option>
                            <option value="dia">Semanal</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <div id="chart-reservas"></div>
                    </div>
                </div>

                <!-- INGRESOS -->
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-graph-up-arrow"></i> Ingresos</h5>

                        <select id="filtroIngresos" class="form-select w-auto">
                            <option value="mes">Mensual</option>
                            <option value="semana">Semanal</option>
                        </select>
                    </div>

                    <div class="card-body">
                        <div id="chart-ingresos"></div>
                    </div>
                </div>

            </div>



            <div class="col-12 col-lg-3">

                <div class="card">
                    <div class="card-header">
                        <h5>
                            <i class="bi bi-pie-chart-fill"></i> Servicios
                        </h5>
                    </div>

                    <div class="card-body">
                        <div id="chart-servicios"></div>
                    </div>
                </div>


                <div class="card mt-3">
                    <div class="card-header">
                        <h5>
                            <i class="bi bi-box-seam"></i> Inventario con mayor stok
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-inventario" style="max-height: 320px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>



        </section>
    </div>
</div>



<script>

    window.reservasMes = {{ reservas_mes | tojson }};

    window.reservasDia = {{ reservas_dia | tojson }};


    window.ingresosMes = {{ ingresos_mes | tojson }};

    window.ingresosDia = {{ ingresos_dia | tojson }};


    window.serviciosPopulares = {{ servicios_populares | tojson }};
    window.productosStock = {{ productos_stock | tojson }};


</script>

<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/panel.css') }}">

<script src="{{ url_for('static', filename='assets/js/librerias/apexcharts.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/modulos-js/panell.js') }}"></script>
