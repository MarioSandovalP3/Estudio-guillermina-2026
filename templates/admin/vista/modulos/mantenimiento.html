<div id="main">

    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Mantenimiento </h3>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="inicio">Inicio</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Mantenimiento</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>


        <section class="section">
            <div class="row">
                <div class="col-12">

                    <div class="card">

                        <!-- HEADER -->
                        <div class="card-header d-flex justify-content-between align-items-center">



                            <!-- BOTÓN CREAR BACKUP -->
                            <button type="button" id="btnCrearBackup"
                                class="btn btn-outline-primary d-flex align-items-center gap-2">

                                <i class="bi bi-cloud-arrow-up"></i>
                                Crear respaldo
                            </button>
                        </div>

                        <!-- BODY -->
                        <div class="card-body">

                            <div class="table-responsive datatable-minimal">

                                <table class="table" id="table1">

                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Tamaño</th>
                                            <th>Fecha</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        {% for b in backups %}
                                        <tr>
                                            <td>{{ b.nombre }}</td>
                                            <td>{{ b.tamaño }}</td>
                                            <td>{{ b.fecha }}</td>

                                            <td class="d-flex gap-2">

                                                <a href="/admin/descargar-backup/{{ b.nombre }}" class="btn btn-primary btn-sm">
                                                    Descargar
                                                </a>

                                                <button class="btn btn-success btn-sm" data-bs-toggle="modal"
                                                    data-bs-target="#modalRestaurarBackup" data-file="{{ b.nombre }}">
                                                    Restaurar
                                                </button>

                                                <button class="btn btn-danger btn-sm btn-limpiar" data-bs-toggle="modal"
                                                    data-bs-target="#modalLimpiarSistema" data-file="{{ b.nombre }}">
                                                    <i class="bi bi-trash"></i>
                                                    Eliminar
                                                </button>

                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </section>

    </div>

    <div class="modal fade" id="modalRestaurarBackup" tabindex="-1" role="dialog"
        aria-labelledby="modalRestaurarBackupLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">

            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header bg-primary">
                    <h5 class="modal-title text-white d-flex align-items-center gap-2" id="modalRestaurarBackupLabel">

                        <i class="bi bi-arrow-counterclockwise"></i>
                        Restaurar Base de Datos
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- FORM -->
                <form id="formRestaurarBackup" method="POST" enctype="multipart/form-data">

                    <div class="modal-body">

                        <input type="hidden" name="restaurar" value="1">

                        <!-- ZONA DE SUBIDA GRANDE -->
                        <div class="border border-2 border-dashed rounded p-5 text-center">

                            <i class="bi bi-cloud-upload fs-1 text-primary"></i>

                            <h5 class="mt-3">Arrastra tu archivo aquí</h5>

                            <p class="text-muted">
                                Formato permitido: .sql
                            </p>

                            <input type="file" name="backup_file" class="form-control mt-3" accept=".sql" required>

                        </div>

                    </div>

                    <!-- FOOTER -->
                    <div class="modal-footer">

                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">

                            <i class="bi bi-upload"></i>
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <div class="modal fade text-left" id="modalLimpiarSistema" tabindex="-1" role="dialog"
        aria-labelledby="modalLimpiarSistemaLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalLimpiarSistemaLabel">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">¿Desea eliminar este respaldo?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger ms-1" onclick="limpiarSistema()">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='/assets/js/modulos-js/mantenimiento.js') }}"></script>

</div>
