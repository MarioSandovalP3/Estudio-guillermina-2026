  <div class="main">
    <div class="card">
      <div
        class="card-body footer-content d-flex flex-wrap align-items-center justify-content-between justify-content-sm-end text-center text-sm-end">

        <!-- Parte izquierda del header: Botón burger -->

          <a href="#" id="burger-btn" class="burger-btn d-block d-xl-none" data-bs-toggle="collapse"
            data-bs-target="#sidebar" aria-expanded="false" aria-controls="sidebar" style="color: #0a75e1;">
            <i class="bi bi-justify fs-3"></i>
          </a>
        </div>


        <!-- Centro del header: Ayuda + Icono de usuario -->
        <div
          class="header-center d-flex flex-wrap align-items-center justify-content-end w-100 w-sm-auto order-1 order-sm-2">
          <!-- ===================================================== -->
          <!-- NOTIFICACIONES -->
          <!-- ===================================================== -->

          <div class="nav-item dropdown me-4 mb-2 mb-sm-0">

            <!-- CAMPANITA -->
            <a class="nav-link position-relative d-flex align-items-center justify-content-center" href="#"
              id="notificacionesDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notificaciones">

              <i class="bi bi-bell-fill fs-3"></i>

              <span id="contadorNotificaciones"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="display: none;">

            </a>


            <!-- =================================================== -->
            <!-- PANEL DE NOTIFICACIONES -->
            <!-- =================================================== -->

            <div class="dropdown-menu dropdown-menu-end shadow-lg p-0" aria-labelledby="notificacionesDropdown"
              style="width: 460px; max-width: 95vw; border-radius: 12px; overflow: hidden;">


              <!-- ================================================= -->
              <!-- ENCABEZADO -->
              <!-- ================================================= -->

              <div class="px-4 py-3 bg-light border-bottom">

                <div class="d-flex align-items-center justify-content-between">

                  <div>

                    <h5 class="mb-1 fw-bold">

                      <i class="bi bi-bell-fill me-2"></i>

                      Notificaciones

                    </h5>
                    <small class="text-muted notificaciones-resumen">
                      No tienes notificaciones nuevas
                    </small>

                  </div>


                  <!-- CONTADOR -->

                  <span class="badge bg-danger fs-6 px-3 py-2 notificaciones-total">
                    0
                  </span>

                </div>

              </div>


              <!-- ================================================= -->
              <!-- CONTENEDOR CON SCROLL -->
              <!-- ================================================= -->

              <div class="contenedor-notificaciones" style="max-height: 430px; overflow-y: auto; overflow-x: hidden;">




              </div>


              <!-- ================================================= -->
              <!-- PIE DEL PANEL -->
              <!-- ================================================= -->

              <div class="border-top bg-light p-2">

                <div class="d-flex justify-content-between align-items-center">

                  <button type="button" class="btn btn-sm btn-outline-secondary">

                    <i class="bi bi-check2-all me-1"></i>

                    Marcar todas como leídas

                  </button>


                  <button type="button" class="btn btn-sm btn-outline-danger">

                    <i class="bi bi-trash3 me-1"></i>

                    Eliminar todas

                  </button>

                </div>

              </div>

            </div>

          </div>

          <!-- Ayuda -->
          <div class="nav-item dropdown separacion-personalizada me-3 mb-2 mb-sm-0">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" data-bs-toggle="dropdown"
              aria-expanded="false">
              <h6 class="mb-0">Ayuda</h6>
            </a>
            <ul class="dropdown-menu menu-ayuda">
              <li> <a class="dropdown-item" href="vista/assets/manual/ManualusuarioAC.pdf" target="_blank">Manual de
                  usuario</a></li>
            </ul>
          </div>

          <!-- Icono de usuario -->
          <div class="navbar-nav-right d-flex align-items-center">
            <ul class="navbar-nav flex-row align-items-center">
              <li class="nav-item dropdown">
                <a href="#" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                  <div
                    class="avatar avatar-online icono-usuario-verde d-flex align-items-center justify-content-center">
                    <i class="bi bi-person-circle fs-3"></i>
                  </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <a class="dropdown-item" href="#">
                      <div class="d-flex align-items-center">
                        <div class="flex-shrink-0 me-3">
                          <div class="avatar avatar-online">
                            <img src="{{ url_for('static', filename='assets/compiled/jpg/1.jpg') }}" alt="Usuario"
                              class="w-px-40 h-auto rounded-circle" />
                          </div>
                        </div>
                        <div class="flex-grow-1">
                          <span class="dropdown-header">
                            {{ session.get('nombre_usuario') }}
                          </span>
                        </div>
                      </div>
                    </a>
                  </li>
                  <li>
                    <hr class="dropdown-divider">
                  </li>
                  <li>
                    <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#primaryheder">
                      <i class="bi bi-person me-2"></i> Mi perfil
                    </a>
                  </li>
                  <li><a class="dropdown-item" href="{{ url_for('cerrarsesion') }}"><i
                        class="bi bi-box-arrow-right me-2"></i> Cerrar sesión</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <div id="contenedorAlertaCancelacion"></div>

    <div id="contenedorCancelacionesHoy"></div>
    <div id="contenedorEmpresaNoRegistrada"></div>


    
    <div id="contenedordevolcionstok"></div>

    <!-- Modal Perfil de Usuario -->
    <div class="modal fade text-left" id="primaryheder" tabindex="-1" role="dialog" aria-labelledby="myModalLabel160"
      aria-hidden="true">

      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
        <div class="modal-content border-0 shadow-lg rounded-3">

          <!-- Encabezado -->
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title text-white" id="myModalLabel160">
              <i class="bi bi-person-circle me-2"></i> Perfil del Usuario
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <!-- Cuerpo -->
          <div class="modal-body p-4">
            <form id="formPerfil" method="post" data-parsley-validate>

              <input type="hidden" name="status" value="1">
              <input type="hidden" name="cod_rol" value="1">

              <!-- CÉDULA -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-credit-card-2-front me-2 text-primary"></i> Cédula
                </label>
                <input type="text" name="cedula" class="form-control" value="{{ session.get('cedula') }}" readonly>
              </div>

              <!-- NOMBRE -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-person me-2 text-primary"></i> Nombre
                </label>
                <input type="text" required maxlength="14" name="nombre_usuario" class="form-control"
                  value="{{ session.get('nombre_usuario') }}"
                  data-parsley-required-message="Este campo es obligatorio.">
              </div>

              <!-- APELLIDO -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-person-check me-2 text-success"></i> Apellido
                </label>
                <input type="text" name="apellido_usuario" required maxlength="10" class="form-control"
                  value="{{ session.get('apellido_usuario') }}"
                  data-parsley-required-message="Este campo es obligatorio.">
              </div>

              <!-- TELÉFONO -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-telephone me-2 text-success"></i> Teléfono
                </label>
                <input type="text" name="telefono" class="form-control" required maxlength="12"
                  value="{{ session.get('telefono') }}" data-parsley-required-message="Este campo es obligatorio.">
              </div>

              <!-- DIRECCIÓN -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-house me-2 text-primary"></i> Dirección
                </label>
                <input type="text" name="direccion" class="form-control" required maxlength="40"
                  value="{{ session.get('direccion') }}" data-parsley-required-message="Este campo es obligatorio.">
              </div>

              <!-- CORREO -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="bi bi-envelope me-2 text-success"></i> Correo
                </label>
                <input type="email" name="correo" class="form-control" required maxlength="30"
                  value="{{ session.get('correo') }}" data-parsley-required-message="Este campo es obligatorio.">
              </div>

              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-2"></i> Guardar cambios
              </button>

            </form>
          </div>

        </div>
      </div>
    </div>



  </div>
